<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="onPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Squircle Dark -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Círculo de Brilho de Fundo -->
  <circle cx="256" cy="256" r="160" fill="#059669" opacity="0.12" filter="url(#glow)"/>

  <!-- Letras DDS -->
  <text x="135" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="118" font-weight="900" fill="#ffffff" letter-spacing="-3">DDS</text>

  <!-- Pílula ON com Efeito Glow -->
  <g transform="translate(355, 205)">
    <rect width="110" height="92" rx="30" fill="url(#onPillGrad)" filter="url(#glow)" opacity="0.4"/>
    <rect width="110" height="92" rx="30" fill="url(#onPillGrad)" stroke="#6ee7b7" stroke-width="4"/>
    <text x="55" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#020617" text-anchor="middle" letter-spacing="1">ON</text>
    <circle cx="92" cy="24" r="8" fill="#a7f3d0"/>
  </g>

  <!-- Linha de Segurança / Slogan -->
  <rect x="135" y="325" width="240" height="8" rx="4" fill="url(#emeraldGrad)" />
  <text x="256" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="6">SEGURANÇA &amp; NRs</text>
</svg>